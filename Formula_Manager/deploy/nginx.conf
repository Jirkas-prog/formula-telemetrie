# Include at http scope using sites-enabled. Keep the manager cookie off the USB link.
map $http_cookie $receiver_cookies {
    default $http_cookie;
    "~^(?<ck_before>.*?)(?:^|;\s*)formula_session=[^;]*(?:;\s*)?(?<ck_after>.*)$" "$ck_before; $ck_after";
}
map $http_upgrade $formula_connection { default upgrade; '' close; }
map $host $formula_https_host {
    default formula-logger.local;
    formula-logger.local formula-logger.local;
    "~^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$" $host;
}

server {
    listen 80 default_server;
    server_name _;
    return 302 https://$formula_https_host$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name formula-logger.local;
    ssl_certificate /etc/formula-manager/web.crt;
    ssl_certificate_key /etc/formula-manager/web.key;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
}
server {
    listen 8444 ssl;
    server_name formula-logger.local;
    ssl_certificate /etc/formula-manager/web.crt;
    ssl_certificate_key /etc/formula-manager/web.key;
    access_log off;
    client_max_body_size 128m;
    location = /_manager_check {
        internal;
        proxy_pass http://127.0.0.1:8080/api/auth/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "formula_session=$cookie_formula_session";
    }
    location / {
        set $foreign_write 0;
        if ($request_method !~ "^(GET|HEAD|OPTIONS)$") { set $foreign_write 1; }
        if ($http_origin = "https://$http_host") { set $foreign_write 0; }
        if ($foreign_write) { return 403; }
        auth_request /_manager_check;
        proxy_pass https://192.168.3.1;
        proxy_ssl_trusted_certificate /etc/formula-manager/receiver.crt;
        proxy_ssl_verify on;
        proxy_ssl_name __RECEIVER_TLS_NAME__;
        proxy_http_version 1.1;
        proxy_set_header Host 192.168.3.1;
        proxy_set_header Origin https://192.168.3.1;
        proxy_set_header Referer https://192.168.3.1/;
        proxy_set_header Cookie $receiver_cookies;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $formula_connection;
        proxy_redirect https://192.168.3.1/ /;
        proxy_read_timeout 75s;
        proxy_buffering off;
        add_header Referrer-Policy same-origin always;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors https://$formula_https_host" always;
    }
}

